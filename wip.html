<!DOCTYPE html>
<html>
<head>
  <title>Duck Casino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library@1.0.1/build/nn.min.js"></script>
  <script src="https://unpkg.com/kaplay@3001.0.19/dist/kaplay.js"></script>
</head>
<body>
<script>
  // wait for the pixel font to load, then start the game
  document.fonts.load('16px "Press Start 2P"').finally(startGame);

  function startGame() {
    // make the canvas (the font option makes ALL text pixelated)
    kaplay({ width: 900, height: 540, background: [20, 10, 40], crisp: true, font: "'Press Start 2P', monospace" });

    // load the files from the repo
    loadSprite("box", "blind_boxes/box1.png");
    loadSprite("card", "blind_boxes/card1.png");
    loadSprite("pack", "tcg-packs/spacePack.png");
    loadSound("casino", "sounds/casino_ambiance.mp3");


    // =====================================================================
    // PART 1: SHARED GAME STATE (every screen uses these)
    // =====================================================================
    let coins = 100;   // the player's money
    let music = null;  // the background music (lives outside the scenes so it keeps playing)


    // =====================================================================
    // PART 2: SOUND SLOTS
    // Put a file path between the quotes to turn a sound on.
    // Leave "" and that sound is just silent (nothing breaks).
    // =====================================================================
    const SOUND_FILES = {
      spin:     "",   // loops while the reels spin        e.g. "sounds/spin.mp3"
      reelStop: "",   // a little click each time a reel stops
      win:      "",   // plays when you win
      lose:     "",   // plays when you lose
      betUp:    "",   // the bet  +  button
      betDown:  "",   // the bet  -  button
    };

    // load every sound that has a file
    for (const name in SOUND_FILES) {
      if (SOUND_FILES[name] !== "") loadSound(name, SOUND_FILES[name]);
    }

    // play a sound by name (does nothing if the slot is empty)
    function playSound(name, options) {
      if (SOUND_FILES[name] === "") return null;
      return play(name, options);
    }


    // =====================================================================
    // PART 3: HELPER FUNCTIONS (buttons, signs, machines, the duck)
    // =====================================================================

    // a simple button: a colored rectangle with text on top
    function makeButton(words, x, y, w, h, btnColor, action) {
      const button = add([rect(w, h), pos(x, y), anchor("center"), color(btnColor), area()]);
      const label = add([text(words, { size: 16 }), pos(x, y), anchor("center")]);
      button.onClick(action);
      return label;
    }

    // the start/stop music button (used on every screen)
    function makeMusicButton(x, y) {
      let label;
      label = makeButton(music ? "Stop music" : "Start music", x, y, 210, 40, rgb(60, 60, 120), () => {
        if (music) {
          music.stop();
          music = null;
          label.text = "Start music";
        } else {
          music = play("casino", { loop: true });
          label.text = "Stop music";
        }
      });
    }

    // thin dark lines over the whole screen = old TV look
    function makeScanlines() {
      for (let y = 0; y < 540; y += 6) {
        add([rect(900, 2), pos(0, y), color(0, 0, 0), opacity(0.12), z(100)]);
      }
    }

    // a neon sign: dark box with a glowing outline and text
    function makeSign(words, x, y, signColor) {
      add([rect(230, 50), pos(x, y), anchor("center"), color(20, 10, 40), outline(4, signColor)]);
      add([text(words, { size: 20 }), pos(x, y), anchor("center"), color(signColor)]);
    }

    // an arcade machine. spriteName = picture on its screen,
    // action = what happens when the duck presses SPACE, screenWords = text on the screen if there is no picture
    function makeCabinet(x, words, spriteName, spriteScale, bodyColor, action, screenWords = "?") {
      // body
      add([rect(170, 250), pos(x, 270), anchor("center"), color(bodyColor), outline(4, rgb(255, 80, 200))]);
      // top sign
      add([rect(170, 34), pos(x, 162), anchor("center"), color(20, 10, 40), outline(4, rgb(90, 220, 255))]);
      add([text(words, { size: 12 }), pos(x, 162), anchor("center"), color(90, 220, 255)]);
      // screen
      add([rect(130, 120), pos(x, 255), anchor("center"), color(10, 10, 30), outline(4, rgb(90, 220, 255))]);
      if (spriteName) {
        add([sprite(spriteName), pos(x, 255), anchor("center"), scale(spriteScale)]);
      } else {
        add([text(screenWords, { size: 24 }), pos(x, 255), anchor("center"), color(255, 214, 102)]);
      }
      // controls
      add([rect(150, 36), pos(x, 345), anchor("center"), color(60, 50, 120)]);
      add([circle(8), pos(x - 30, 345), color(255, 60, 160)]);
      add([circle(8), pos(x + 30, 345), color(90, 220, 255)]);

      // remember where this machine is, so the duck can find it
      return { x: x, action: action };
    }

    // the duck, built from a few colored blocks (swap for a PNG later!)
    function makeDuck(x, y) {
      const duck = add([pos(x, y), scale(2), z(10)]);
      duck.add([rect(20, 14), pos(-10, -17), color(255, 255, 255)]);   // body
      duck.add([rect(9, 6), pos(-7, -14), color(215, 215, 235)]);      // wing
      duck.add([rect(12, 12), pos(2, -27), color(255, 255, 255)]);     // head
      duck.add([rect(6, 4), pos(14, -21), color(255, 150, 40)]);       // beak
      duck.add([rect(2, 2), pos(9, -24), color(0, 0, 0)]);             // eye
      duck.add([rect(5, 3), pos(-7, -3), color(255, 150, 40)]);        // left foot
      duck.add([rect(5, 3), pos(2, -3), color(255, 150, 40)]);         // right foot
      return duck;
    }


    // =====================================================================
    // PART 4: SLOT MACHINE DATA + SYMBOLS
    // =====================================================================
    const SYMBOLS = ["duck", "gem", "bow", "coin", "egg"];
    const WEIGHTS = { duck: 1, gem: 2, bow: 3, coin: 4, egg: 5 };            // bigger = shows up more often
    const THREE_PAYS = { duck: 50, gem: 20, bow: 10, coin: 8, egg: 5 };      // 3 the same: bet x this
    const TWO_PAYS = { duck: 3, gem: 2, bow: 1, coin: 1, egg: 0 };           // 2 the same: bet x this
    const BET_STEPS = [5, 10, 25, 50, 100];                                   // the bets you can pick
    let betIndex = 1;                                                         // starts at 10

    // pick a random symbol (rare ones come up less)
    function pickSymbol() {
      let total = 0;
      for (const s of SYMBOLS) total += WEIGHTS[s];
      let roll = Math.random() * total;
      for (const s of SYMBOLS) {
        roll -= WEIGHTS[s];
        if (roll < 0) return s;
      }
      return SYMBOLS[0];
    }

    // work out how much a spin wins
    function getPayout(result, bet) {
      const a = result[0];
      const b = result[1];
      const c = result[2];

      if (a === b && b === c) {
        return { amount: bet * THREE_PAYS[a], text: "3x " + a.toUpperCase() + "!" };
      }

      let pair = null;
      if (a === b || a === c) pair = a;
      else if (b === c) pair = b;

      if (pair && TWO_PAYS[pair] > 0) {
        return { amount: bet * TWO_PAYS[pair], text: "PAIR OF " + pair.toUpperCase() + "S" };
      }
      return { amount: 0, text: "NO LUCK" };
    }

    // draw one reel symbol out of colored shapes (centered on x, y)
    function makeSymbol(name, x, y) {
      const s = add([pos(x, y), scale(name === "duck" ? 3 : 1), z(5)]);

      if (name === "duck") {
        s.add([rect(20, 14), pos(-13, -4), color(255, 255, 255), outline(1, rgb(180, 180, 200))]);  // body
        s.add([rect(9, 6), pos(-10, -1), color(215, 215, 235)]);                                    // wing
        s.add([rect(12, 12), pos(-1, -14), color(255, 255, 255), outline(1, rgb(180, 180, 200))]);  // head
        s.add([rect(6, 4), pos(11, -8), color(255, 150, 40)]);                                      // beak
        s.add([rect(2, 2), pos(6, -11), color(0, 0, 0)]);                                           // eye
        s.add([rect(5, 3), pos(-10, 10), color(255, 150, 40)]);                                     // feet
        s.add([rect(5, 3), pos(-1, 10), color(255, 150, 40)]);
      }

      if (name === "coin") {
        s.add([circle(32), color(255, 200, 50), outline(4, rgb(180, 120, 20))]);
        s.add([circle(22), color(255, 228, 120)]);
        s.add([text("$", { size: 28 }), anchor("center"), color(180, 120, 20)]);
      }

      if (name === "egg") {
        s.add([circle(28), scale(0.85, 1.15), color(255, 214, 170), outline(4, rgb(190, 120, 70))]);
        s.add([circle(4), pos(-9, -6), color(205, 140, 90)]);
        s.add([circle(3), pos(7, 8), color(205, 140, 90)]);
        s.add([circle(3), pos(-3, 16), color(205, 140, 90)]);
      }

      if (name === "gem") {
        s.add([polygon([vec2(0, -36), vec2(28, -6), vec2(0, 36), vec2(-28, -6)]), color(90, 220, 255), outline(4, rgb(40, 120, 180))]);
        s.add([polygon([vec2(0, -30), vec2(10, -6), vec2(0, 28), vec2(-10, -6)]), color(200, 245, 255)]);
      }

      if (name === "bow") {
        s.add([polygon([vec2(0, 0), vec2(-38, -22), vec2(-38, 22)]), color(150, 190, 240), outline(3, rgb(90, 130, 200))]);
        s.add([polygon([vec2(0, 0), vec2(38, -22), vec2(38, 22)]), color(150, 190, 240), outline(3, rgb(90, 130, 200))]);
        s.add([rect(16, 26), anchor("center"), color(110, 150, 220), outline(3, rgb(90, 130, 200))]);
      }

      return s;
    }


    // =====================================================================
    // SCREEN 1: START PAGE
    // =====================================================================
    scene("start", () => {
      add([text("DUCK CASINO", { size: 48 }), pos(454, 74), anchor("center"), color(120, 20, 90)]);
      const title = add([text("DUCK CASINO", { size: 48 }), pos(450, 70), anchor("center"), color(255, 80, 200), opacity(1)]);
      add([text("~ the quack box casino ~", { size: 16 }), pos(450, 125), anchor("center"), color(90, 220, 255)]);

      // make the title flicker like a neon sign
      onUpdate(() => {
        title.opacity = wave(0.7, 1, time() * 4);
      });

      add([sprite("box"), pos(170, 300), anchor("center"), scale(2)]);
      add([sprite("pack"), pos(450, 300), anchor("center"), scale(0.45)]);
      add([sprite("card"), pos(730, 300), anchor("center"), scale(2)]);

      makeButton("PLAY", 450, 490, 200, 50, rgb(236, 64, 160), () => go("lobby"));
      makeMusicButton(770, 500);
      makeScanlines();
    });


    // =====================================================================
    // SCREEN 2: THE CASINO FLOOR (walk around!)
    // =====================================================================
    scene("lobby", () => {
      // back wall + neon strip on the ceiling
      add([rect(900, 230), pos(0, 0), color(25, 20, 70)]);
      add([rect(900, 8), pos(0, 0), color(90, 220, 255)]);

      // signs on the wall
      makeSign("CASINO", 150, 70, rgb(255, 80, 200));
      makeSign("ARCADE", 750, 70, rgb(90, 220, 255));
      add([text("COINS: " + coins, { size: 14 }), pos(450, 30), anchor("center"), color(255, 214, 102)]);
      add([text("WALK UP TO A MACHINE", { size: 14 }), pos(450, 62), anchor("center"), color(255, 214, 102)]);
      add([text("ARROWS / WASD + SPACE", { size: 12 }), pos(450, 90), anchor("center"), color(90, 220, 255)]);

      // checkered floor
      for (let row = 0; row < 6; row++) {
        for (let col = 0; col < 15; col++) {
          const dark = (row + col) % 2 === 0;
          add([rect(60, 60), pos(col * 60, 230 + row * 60), color(dark ? rgb(20, 40, 110) : rgb(30, 60, 150))]);
        }
      }

      // the machines (only the first three do something)
     makeCabinet(130, "COMING SOON", null, 0.5, rgb(40, 30, 100), () => go("open", "box"));
      makeCabinet(340, "COMING SOON", null, 0.2, rgb(40, 30, 100), () => go("open", "pack"));
      const slotMachine = makeCabinet(550, "DUCK SLOTS", null, 0, rgb(40, 30, 100), () => go("slots"), "777");
      makeCabinet(760, "COMING SOON", null, 0, rgb(50, 50, 60), null);
      const machines = [ slotMachine];

      // the duck + the message that pops up when it is next to a machine
      const duck = makeDuck(450, 495);
      const prompt = add([text("PRESS SPACE", { size: 12 }), anchor("center"), color(255, 214, 102), z(20)]);
      let near = null;

      onUpdate(() => {
        // which keys are held?
        let dx = 0;
        let dy = 0;
        if (isKeyDown("left") || isKeyDown("a")) dx = -1;
        if (isKeyDown("right") || isKeyDown("d")) dx = 1;
        if (isKeyDown("up") || isKeyDown("w")) dy = -1;
        if (isKeyDown("down") || isKeyDown("s")) dy = 1;

        // move the duck, but keep it on the floor in front of the machines
        duck.pos.x = clamp(duck.pos.x + dx * 200 * dt(), 30, 870);
        duck.pos.y = clamp(duck.pos.y + dy * 200 * dt(), 420, 505);

        // face the way we are walking, and waddle a little
        if (dx !== 0) duck.scale.x = dx > 0 ? 2 : -2;
        const moving = dx !== 0 || dy !== 0;
        duck.scale.y = moving ? 2 + Math.sin(time() * 25) * 0.2 : 2;

        // is the duck close to a machine?
        near = null;
        for (const m of machines) {
          if (duck.pos.dist(vec2(m.x, 400)) < 70) near = m;
        }
        prompt.hidden = near === null;
        prompt.pos = vec2(duck.pos.x, duck.pos.y + 20);
      });

      onKeyPress("space", () => {
        if (near) near.action();
      });

      makeButton("BACK", 80, 520, 130, 32, rgb(60, 60, 120), () => go("start"));
      makeMusicButton(790, 520);
      makeScanlines();
    });


    // =====================================================================
    // SCREEN 4: DUCK SLOTS
    // =====================================================================
    scene("slots", () => {
      add([text("DUCK SLOTS", { size: 28 }), pos(450, 45), anchor("center"), color(255, 80, 200)]);

      // the machine frame + three reel windows
      add([rect(540, 230), pos(450, 205), anchor("center"), color(30, 20, 80), outline(6, rgb(255, 80, 200))]);
      const reelX = [310, 450, 590];
      const reelY = 205;
      for (const x of reelX) {
        add([rect(130, 170), pos(x, reelY), anchor("center"), color(245, 240, 225), outline(4, rgb(90, 220, 255))]);
      }

      // little arrows pointing at the winning line
      add([polygon([vec2(0, -12), vec2(18, 0), vec2(0, 12)]), pos(190, reelY), color(255, 214, 102)]);
      add([polygon([vec2(0, -12), vec2(-18, 0), vec2(0, 12)]), pos(710, reelY), color(255, 214, 102)]);

      // what each reel is showing right now
      const shown = [null, null, null];
      function showSymbol(i, name) {
        if (shown[i]) destroy(shown[i]);
        shown[i] = makeSymbol(name, reelX[i], reelY);
      }
      showSymbol(0, "duck");
      showSymbol(1, "coin");
      showSymbol(2, "egg");

      // the text on screen
      const message = add([text("PRESS SPIN!", { size: 16 }), pos(450, 350), anchor("center"), color(255, 214, 102)]);
      const coinText = add([text("", { size: 16 }), pos(150, 400), anchor("center"), color(255, 214, 102)]);
      const winText = add([text("LAST WIN: 0", { size: 16 }), pos(750, 400), anchor("center"), color(90, 220, 255)]);
      const betText = add([text("", { size: 16 }), pos(450, 460), anchor("center"), color(255, 255, 255)]);

      function updateHud() {
        coinText.text = "COINS: " + coins;
        betText.text = "BET " + BET_STEPS[betIndex];
      }
      updateHud();

      // ----- bet + and - -----
      function changeBet(direction) {
        if (spinning) return;
        const newIndex = clamp(betIndex + direction, 0, BET_STEPS.length - 1);
        if (newIndex === betIndex) return;
        betIndex = newIndex;
        playSound(direction > 0 ? "betUp" : "betDown");
        updateHud();
      }

      // ----- spinning -----
      let spinning = false;
      let spinSound = null;
      let spinTime = 0;
      let flickerTimer = 0;
      let currentBet = 0;
      let finalSymbols = [];
      const stopped = [true, true, true];
      const STOP_AT = [1.0, 1.7, 2.4];   // seconds when each reel stops

      function spin() {
        if (spinning) return;
        const bet = BET_STEPS[betIndex];
        if (coins < bet) {
          message.text = "NOT ENOUGH COINS";
          message.color = rgb(255, 90, 90);
          return;
        }

        coins -= bet;
        currentBet = bet;
        updateHud();

        finalSymbols = [pickSymbol(), pickSymbol(), pickSymbol()];
        stopped[0] = false;
        stopped[1] = false;
        stopped[2] = false;
        spinTime = 0;
        flickerTimer = 0;
        spinning = true;

        message.text = "SPINNING...";
        message.color = rgb(90, 220, 255);
        spinSound = playSound("spin", { loop: true });
      }

      function finish() {
        spinning = false;
        if (spinSound) {
          spinSound.stop();
          spinSound = null;
        }

        const result = getPayout(finalSymbols, currentBet);
        coins += result.amount;

        if (result.amount > 0) {
          message.text = result.text + "  +" + result.amount;
          message.color = rgb(255, 214, 102);
          playSound("win");
        } else {
          message.text = result.text;
          message.color = rgb(255, 90, 160);
          playSound("lose");
        }
        winText.text = "LAST WIN: " + result.amount;

        // if you are broke, here is a free refill
        if (coins < BET_STEPS[0]) {
          coins += 50;
          message.text = "OUT OF COINS! +50 FREE";
        }
        updateHud();
      }

      onUpdate(() => {
        if (!spinning) return;
        spinTime += dt();
        flickerTimer += dt();

        const flicker = flickerTimer > 0.05;
        if (flicker) flickerTimer = 0;

        for (let i = 0; i < 3; i++) {
          if (stopped[i]) continue;
          if (spinTime >= STOP_AT[i]) {
            stopped[i] = true;
            showSymbol(i, finalSymbols[i]);
            playSound("reelStop");
          } else if (flicker) {
            showSymbol(i, SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
          }
        }

        if (stopped[0] && stopped[1] && stopped[2]) finish();
      });

      // ----- buttons -----
      makeButton("SPIN", 450, 400, 300, 50, rgb(236, 64, 160), spin);
      makeButton("-", 350, 460, 50, 44, rgb(60, 60, 120), () => changeBet(-1));
      makeButton("+", 550, 460, 50, 44, rgb(60, 60, 120), () => changeBet(1));
      onKeyPress("space", spin);

      makeButton("BACK", 80, 520, 130, 32, rgb(60, 60, 120), () => {
        if (!spinning) go("lobby");   // can't leave in the middle of a spin
      });
      makeMusicButton(790, 520);
      makeScanlines();
    });

    go("start");
  }
</script>
</body>
</html>
